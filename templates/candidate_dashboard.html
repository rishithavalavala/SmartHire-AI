<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Candidate Portal - SmartHire AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #eef2ff, #f8fafc);
            min-height: 100vh;
        }

        .page-wrapper {
            padding: 40px 20px;
        }

        .header-card {
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            color: white;
            border-radius: 24px;
            padding: 30px;
            box-shadow: 0 16px 36px rgba(0,0,0,0.08);
            margin-bottom: 28px;
        }

        .form-card {
            background: white;
            border-radius: 24px;
            box-shadow: 0 14px 32px rgba(0,0,0,0.08);
            padding: 32px;
        }

        .form-label {
            font-weight: 700;
            color: #111827;
        }

        .form-control {
            border-radius: 14px;
            padding: 12px 14px;
        }

        .btn-analyze {
            background: linear-gradient(135deg, #16a34a, #15803d);
            border: none;
            border-radius: 14px;
            padding: 14px 24px;
            font-weight: 700;
            width: 100%;
        }

        .info-box {
            background: #eef2ff;
            border-radius: 16px;
            padding: 18px;
            margin-bottom: 24px;
        }
    </style>
</head>
<body>

<div class="container page-wrapper">
    <div class="header-card">
        <h2 class="mb-2">Candidate Portal</h2>
        <p class="mb-0">Upload your resume, paste the target job description, and let SmartHire AI evaluate your fit and generate an interview.</p>
    </div>

    <div class="form-card">
        <div class="info-box">
            <strong>Instructions:</strong>
            Upload your resume in PDF format, enter the target role, and paste the job description to get accurate skill matching and AI interview questions.
        </div>

        <form action="/analyze" method="POST" enctype="multipart/form-data">
            <div class="mb-3">
                <label class="form-label">Candidate Name</label>
                <input type="text" name="candidate_name" class="form-control" placeholder="Enter your full name" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Target Role</label>
                <input type="text" name="target_role" class="form-control" placeholder="Example: AI/ML Associate Engineer" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Job Description</label>
                <textarea name="job_description" rows="10" class="form-control" placeholder="Paste the target job description here..." required></textarea>
            </div>

            <div class="mb-4">
                <label class="form-label">Upload Resume (PDF)</label>
                <input type="file" name="resume" class="form-control" accept=".pdf" required>
            </div>

            <button type="submit" class="btn btn-success btn-analyze">Analyze Resume with SmartHire AI</button>
        </form>
    </div>
</div>

</body>
</html>
